<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ライバルボード</title>
<meta name="description" content="吉岡小タイピング道場・黒帯の昇段試験で出たチャレンジポイントを登録できる、みんなで作るランキングボード">
<style id="rb-style">
  :root{
    --bg:#F7F2E8;
    --bg-alt:#FBF7EF;
    --card:#FFFDF9;
    --ink:#29251F;
    --ink-soft:#6E6355;
    --accent:#BE3A34;
    --accent-dark:#9C2C27;
    --accent-ink:#FFFDF9;
    --belt-green:#4C8B5D;
    --belt-blue:#3A6EA5;
    --belt-black:#29251F;
    --gold-fill:#C99A1E;
    --line:#DED0B4;
    --shadow:rgba(60,44,20,0.14);
    --focus:#2B5FB0;
    --bad:#BE3A34;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1C1712; --bg-alt:#231D16; --card:#2A231A;
      --ink:#F2EBDB; --ink-soft:#B7A98E;
      --accent:#E2564E; --accent-dark:#C74138; --accent-ink:#1C1712;
      --belt-green:#68AD7F; --belt-blue:#6E9FD4; --belt-black:#F2EBDB;
      --gold-fill:#DDB13B; --line:#3B3120; --shadow:rgba(0,0,0,0.45); --focus:#8FB8F0; --bad:#E2564E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1C1712; --bg-alt:#231D16; --card:#2A231A;
    --ink:#F2EBDB; --ink-soft:#B7A98E;
    --accent:#E2564E; --accent-dark:#C74138; --accent-ink:#1C1712;
    --belt-green:#68AD7F; --belt-blue:#6E9FD4; --belt-black:#F2EBDB;
    --gold-fill:#DDB13B; --line:#3B3120; --shadow:rgba(0,0,0,0.45); --focus:#8FB8F0; --bad:#E2564E;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--bg); color:var(--ink);
    font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Meiryo',sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  h1{
    font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Meiryo',serif;
    font-weight:700; text-wrap:balance; margin:0; font-size:1.6rem;
  }
  .mono{font-family:Consolas,'SF Mono',Menlo,monospace; font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button, select, input{font-family:inherit;}
  :focus-visible{outline:3px solid var(--focus); outline-offset:3px; border-radius:4px;}

  .topbar{max-width:820px; margin:0 auto; padding:22px 24px 0;}
  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    font-size:0.9rem; color:var(--ink-soft); text-decoration:none;
    border-bottom:1px dashed var(--ink-soft); padding-bottom:2px;
  }
  .back-link:hover{color:var(--gold-fill); border-color:var(--gold-fill);}

  main{max-width:820px; margin:0 auto; padding:28px 24px 60px;}
  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:36px 32px; box-shadow:0 10px 28px var(--shadow); text-align:center;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:0.8rem; font-weight:700; letter-spacing:0.1em;
    color:var(--gold-fill); background:color-mix(in srgb, var(--gold-fill) 16%, transparent);
    border:1px solid var(--gold-fill); padding:5px 14px; border-radius:2px; margin-bottom:16px;
  }
  .lead{color:var(--ink-soft); font-size:0.95rem; max-width:50ch; margin:12px auto 0;}

  .register-card{
    margin:26px auto 0; max-width:480px; text-align:left;
    background:var(--bg-alt); border:1px dashed var(--gold-fill); border-radius:10px; padding:20px 22px;
  }
  .register-card > .mono{font-size:0.72rem; color:var(--ink-soft); letter-spacing:0.06em;}
  #registerForm{display:grid; gap:12px;}
  #registerForm label{display:grid; gap:4px; font-size:0.82rem; color:var(--ink-soft); font-weight:700;}
  .name-note{margin:-6px 0 0; font-size:0.74rem; font-weight:400; color:var(--bad);}
  #registerForm select, #registerForm input{
    font-size:0.95rem; padding:9px 10px; border-radius:6px; border:1px solid var(--line);
    background:var(--card); color:var(--ink);
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; margin-top:6px;
    padding:12px 24px; border-radius:6px; border:1px solid transparent;
    font-weight:700; font-size:0.95rem; cursor:pointer;
    font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
    background:var(--gold-fill); color:var(--accent-ink);
    box-shadow:0 4px 0 color-mix(in srgb, var(--gold-fill) 70%, black);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:0.6; cursor:default; transform:none;}
  .form-note{min-height:1.3em; font-size:0.82rem; color:var(--bad);}

  .table-wrap{overflow-x:auto; margin-top:28px;}
  .rank-table{width:100%; border-collapse:collapse; font-size:0.88rem; min-width:520px;}
  .rank-table th, .rank-table td{padding:10px 12px; border-bottom:1px solid var(--line); text-align:left;}
  .rank-table th{color:var(--ink-soft); font-size:0.74rem; letter-spacing:0.04em; font-weight:700;}
  .rank-table td.rank{font-family:Consolas,'SF Mono',Menlo,monospace; font-weight:700; color:var(--ink-soft); width:3.5em;}
  .rank-table tr:nth-child(1) td.rank{color:var(--gold-fill);}
  .rank-table td.name{font-weight:700;}
  .rank-table td.pts{font-family:Consolas,'SF Mono',Menlo,monospace; font-weight:700; color:var(--gold-fill); font-variant-numeric:tabular-nums;}
  .rank-table td.empty{color:var(--ink-soft); text-align:center; padding:30px 10px;}

  @media (max-width:560px){
    .panel{padding:26px 18px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="index.html">← 吉岡小タイピング道場 にもどる</a>
</div>

<main>
  <div class="panel" id="app"></div>
</main>

<script id="rb-logic">
function RB_INIT(){
  var API_URL = '/api/rival-board';
  var EXAM_URL = 'exam-practice.html';
  var app = document.getElementById('app');

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // Older entries were stored as "6年生"; show them the same as new "6年" entries.
  function displayGrade(g){
    return String(g).replace(/生$/, '');
  }

  function renderTableRows(list){
    if (!list.length){
      return '<tr><td colspan="6" class="empty">まだ登録がありません。黒帯の昇段試験を受けて、さいしょのランカーになろう。</td></tr>';
    }
    return list.map(function(e,i){
      return '<tr><td class="rank">'+(i+1)+'位</td><td>'+escapeHtml(displayGrade(e.grade))+' '+escapeHtml(e.cls)+'</td><td class="name">'+escapeHtml(e.name)+'</td>'+
        '<td class="pts">'+e.points+'</td><td>'+e.speed+'文字/分</td><td>'+e.accuracy+'%</td></tr>';
    }).join('');
  }

  function renderBodyHtml(loading){
    var rowsHtml = loading ? '<tr><td colspan="6" class="empty">読みこみちゅう…</td></tr>' : renderTableRows([]);

    var gradeOptions = ['1年','2年','3年','4年','5年','6年'].map(function(g){
      return '<option value="'+g+'">'+g+'</option>';
    }).join('');
    var clsOptions = ['1組','2組','3組','4組','ほしの子学級'].map(function(c){
      return '<option value="'+c+'">'+c+'</option>';
    }).join('');
    var formHtml =
      '<div class="register-card">'+
        '<span class="mono">黒帯の昇段試験の結果画面に出た「とうろくコード」を入力しよう</span>'+
        '<form id="registerForm">'+
          '<label>学年<select name="grade" required><option value="">えらぶ</option>'+gradeOptions+'</select></label>'+
          '<label>組・学級<select name="cls" required><option value="">えらぶ</option>'+clsOptions+'</select></label>'+
          '<label>ニックネーム＋名前<input name="name" maxlength="20" required></label>'+
          '<p class="name-note">直接本名を書き込むことのないようにしてくださいね。ふざけすぎたものや見た人を不快にさせるものはランキングにはのせません。</p>'+
          '<label>とうろくコード<input name="code" maxlength="20" placeholder="れい：3K2P1-9F" required style="font-family:Consolas,\'SF Mono\',Menlo,monospace;"></label>'+
          '<button type="submit" class="btn">ライバルボードに登録する</button>'+
          '<div class="form-note" id="formNote">&nbsp;</div>'+
        '</form>'+
        '<p class="lead" style="margin:12px 0 0; font-size:0.82rem;">コードがない人は<a class="back-link" href="'+EXAM_URL+'">黒帯の昇段試験を受けてね →</a></p>'+
      '</div>';

    return ''+
      '<span class="eyebrow">ライバルボード</span>'+
      '<h1>チャレンジポイント ランキング</h1>'+
      '<p class="lead">黒帯の昇段試験の結果を登録して、道場のみんなと競おう。</p>'+
      formHtml+
      '<div class="table-wrap"><table class="rank-table"><thead><tr><th>順位</th><th>学年・組</th><th>なまえ</th><th>ポイント</th><th>速さ</th><th>正確率</th></tr></thead><tbody id="rankBody">'+rowsHtml+'</tbody></table></div>';
  }

  function updateRows(list){
    var body = document.getElementById('rankBody');
    if (body) body.innerHTML = renderTableRows(list);
  }

  var ERROR_MESSAGES = {
    invalid_grade: '学年・組・なまえをすべて入力してね。',
    invalid_cls: '学年・組・なまえをすべて入力してね。',
    invalid_name: '学年・組・なまえをすべて入力してね。',
    invalid_code: 'コードが正しくありません。結果画面のコードをよく見て、もう一度入力してね。'
  };

  function wireForm(){
    var form = document.getElementById('registerForm');
    if (!form) return;
    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      var fd = new FormData(form);
      var grade = (fd.get('grade')||'').toString().trim();
      var cls = (fd.get('cls')||'').toString().trim();
      var name = (fd.get('name')||'').toString().trim();
      var code = (fd.get('code')||'').toString().trim();
      var note = document.getElementById('formNote');
      if (!grade || !cls || !name || !code){
        note.textContent = '学年・組・なまえ・とうろくコードをすべて入力してね。';
        return;
      }
      var submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      note.textContent = 'とうろくちゅう…';
      register({grade:grade, cls:cls, name:name, code:code}, form);
    });
  }

  function register(payload, form){
    var note = document.getElementById('formNote');
    function reenable(){
      var btn = form.querySelector('button[type="submit"]');
      if (btn) btn.disabled = false;
    }
    fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    }).then(function(res){
      if (!res.ok){
        return res.json().catch(function(){ return {}; }).then(function(data){
          note.textContent = ERROR_MESSAGES[data.error] || 'とうろくに失敗しました。もう一度ためしてね。';
          reenable();
        });
      }
      return res.json().then(function(list){
        note.textContent = 'とうろくできました！';
        updateRows(list);
        form.reset();
        reenable();
      });
    }).catch(function(){
      note.textContent = 'とうろくに失敗しました。通信を確認してもう一度ためしてね。';
      reenable();
    });
  }

  function load(){
    app.innerHTML = renderBodyHtml(true);
    wireForm();
    fetch(API_URL).then(function(res){
      if (!res.ok) throw new Error('bad status');
      return res.json();
    }).then(function(list){
      updateRows(list);
    }).catch(function(){
      var body = document.getElementById('rankBody');
      if (body) body.innerHTML = '<tr><td colspan="6" class="empty">ランキングを読みこめませんでした。時間をおいてためしてね。</td></tr>';
    });
  }

  load();
}
</script>
<script id="rb-boot">
(function(){
  RB_INIT();
})();
</script>
</body>
</html>
