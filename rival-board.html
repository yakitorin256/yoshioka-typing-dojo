<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ランキングボード</title>
<meta name="description" content="吉岡小タイピング道場・黒帯の昇段試験で出たチャレンジポイントを登録できる、みんなで作るランキングボード">
<style id="rb-style">
  :root{
    --bg:#F7F2E8;
    --bg-alt:#FBF7EF;
    --card:#FFFDF9;
    --ink:#29251F;
    --ink-soft:#6E6355;
    --accent:#BE3A34;
    --accent-dark:#9C2C27;
    --accent-ink:#FFFDF9;
    --belt-green:#4C8B5D;
    --belt-blue:#3A6EA5;
    --belt-black:#29251F;
    --gold-fill:#C99A1E;
    --line:#DED0B4;
    --shadow:rgba(60,44,20,0.14);
    --focus:#2B5FB0;
    --bad:#BE3A34;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1C1712; --bg-alt:#231D16; --card:#2A231A;
      --ink:#F2EBDB; --ink-soft:#B7A98E;
      --accent:#E2564E; --accent-dark:#C74138; --accent-ink:#1C1712;
      --belt-green:#68AD7F; --belt-blue:#6E9FD4; --belt-black:#F2EBDB;
      --gold-fill:#DDB13B; --line:#3B3120; --shadow:rgba(0,0,0,0.45); --focus:#8FB8F0; --bad:#E2564E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1C1712; --bg-alt:#231D16; --card:#2A231A;
    --ink:#F2EBDB; --ink-soft:#B7A98E;
    --accent:#E2564E; --accent-dark:#C74138; --accent-ink:#1C1712;
    --belt-green:#68AD7F; --belt-blue:#6E9FD4; --belt-black:#F2EBDB;
    --gold-fill:#DDB13B; --line:#3B3120; --shadow:rgba(0,0,0,0.45); --focus:#8FB8F0; --bad:#E2564E;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:var(--bg); color:var(--ink);
    font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Meiryo',sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  h1{
    font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Meiryo',serif;
    font-weight:700; text-wrap:balance; margin:0; font-size:1.6rem;
  }
  .mono{font-family:Consolas,'SF Mono',Menlo,monospace; font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button, select, input{font-family:inherit;}
  :focus-visible{outline:3px solid var(--focus); outline-offset:3px; border-radius:4px;}

  .topbar{max-width:820px; margin:0 auto; padding:22px 24px 0;}
  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    font-size:0.9rem; color:var(--ink-soft); text-decoration:none;
    border-bottom:1px dashed var(--ink-soft); padding-bottom:2px;
  }
  .back-link:hover{color:var(--gold-fill); border-color:var(--gold-fill);}

  main{max-width:820px; margin:0 auto; padding:28px 24px 60px;}
  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:36px 32px; box-shadow:0 10px 28px var(--shadow); text-align:center;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:0.8rem; font-weight:700; letter-spacing:0.1em;
    color:var(--gold-fill); background:color-mix(in srgb, var(--gold-fill) 16%, transparent);
    border:1px solid var(--gold-fill); padding:5px 14px; border-radius:2px; margin-bottom:16px;
  }
  .lead{color:var(--ink-soft); font-size:0.95rem; max-width:50ch; margin:12px auto 0;}

  .register-card{
    margin:26px auto 0; max-width:480px; text-align:left;
    background:var(--bg-alt); border:1px dashed var(--gold-fill); border-radius:10px; padding:20px 22px;
  }
  .register-card > .mono{font-size:0.72rem; color:var(--ink-soft); letter-spacing:0.06em;}
  #registerForm{display:grid; gap:12px;}
  #registerForm label{display:grid; gap:4px; font-size:0.82rem; color:var(--ink-soft); font-weight:700;}
  .name-note{margin:-6px 0 0; font-size:0.74rem; font-weight:400; color:var(--bad);}
  #registerForm select, #registerForm input{
    font-size:0.95rem; padding:9px 10px; border-radius:6px; border:1px solid var(--line);
    background:var(--card); color:var(--ink);
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; margin-top:6px;
    padding:12px 24px; border-radius:6px; border:1px solid transparent;
    font-weight:700; font-size:0.95rem; cursor:pointer;
    font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
    background:var(--gold-fill); color:var(--accent-ink);
    box-shadow:0 4px 0 color-mix(in srgb, var(--gold-fill) 70%, black);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:0.6; cursor:default; transform:none;}
  .form-note{min-height:1.3em; font-size:0.82rem; color:var(--bad);}

  .table-wrap{overflow-x:auto; margin-top:28px;}
  .rank-table{width:100%; border-collapse:collapse; font-size:0.88rem; min-width:640px;}
  .rank-table th, .rank-table td{padding:10px 12px; border-bottom:1px solid var(--line); text-align:left;}
  .rank-table th{color:var(--ink-soft); font-size:0.74rem; letter-spacing:0.04em; font-weight:700;}
  .rank-table td.rank{font-family:Consolas,'SF Mono',Menlo,monospace; font-weight:700; color:var(--ink-soft); width:3.5em;}
  .rank-table tr:nth-child(1) td.rank{color:var(--gold-fill);}
  .rank-table td.name{font-weight:700;}
  .rank-table td.pts{font-family:Consolas,'SF Mono',Menlo,monospace; font-weight:700; color:var(--gold-fill); font-variant-numeric:tabular-nums;}
  .rank-table td.when{font-size:0.8rem; color:var(--ink-soft); white-space:nowrap;}
  .rank-table td.empty{color:var(--ink-soft); text-align:center; padding:30px 10px;}

  .admin-block{margin-top:34px; text-align:left; border-top:1px solid var(--line); padding-top:18px;}
  .admin-block summary{cursor:pointer; font-size:0.8rem; color:var(--ink-soft); font-weight:700;}
  .admin-login{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .admin-login input{
    font-size:0.9rem; padding:8px 10px; border-radius:6px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); flex:1; min-width:160px;
  }
  .admin-note{min-height:1.3em; font-size:0.8rem; color:var(--bad); margin-top:6px;}
  .admin-table{width:100%; border-collapse:collapse; font-size:0.82rem; margin-top:14px; min-width:980px;}
  .admin-table th, .admin-table td{padding:8px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle;}
  .admin-table th{color:var(--ink-soft); font-size:0.7rem; letter-spacing:0.04em; white-space:nowrap;}
  .admin-table input, .admin-table select{
    font-size:0.82rem; padding:5px 6px; border-radius:6px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); max-width:100%;
  }
  .admin-table input.f-name{width:9.5em;}
  .admin-table input.f-num{width:5.2em;}
  .admin-table td.cur-rank{font-family:Consolas,'SF Mono',Menlo,monospace; font-weight:700; white-space:nowrap;}
  .admin-table td.when{font-size:0.74rem; color:var(--ink-soft); white-space:nowrap;}
  .admin-table td.actions{white-space:nowrap;}
  .admin-table tr.dirty{background:color-mix(in srgb, var(--gold-fill) 14%, transparent);}
  .admin-help{margin:10px 0 0; font-size:0.76rem; color:var(--ink-soft);}
  .admin-save-btn{
    font-size:0.76rem; font-weight:700; color:var(--accent-ink); background:var(--belt-green);
    border:1px solid var(--belt-green); border-radius:6px; padding:4px 12px; cursor:pointer; margin-right:6px;
  }
  .admin-save-btn:disabled{opacity:0.5; cursor:default;}
  .admin-del-btn{
    font-size:0.76rem; font-weight:700; color:var(--bad); background:transparent;
    border:1px solid var(--bad); border-radius:6px; padding:4px 10px; cursor:pointer;
  }
  .admin-del-btn:hover{background:color-mix(in srgb, var(--bad) 12%, transparent);}
  .admin-del-btn:disabled{opacity:0.5; cursor:default;}

  @media (max-width:560px){
    .panel{padding:26px 18px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="index.html">← 吉岡小タイピング道場 にもどる</a>
</div>

<main>
  <div class="panel" id="app"></div>
</main>

<script id="rb-logic">
function RB_INIT(){
  var API_URL = '/api/rival-board';
  var EXAM_URL = 'exam-practice.html';
  var app = document.getElementById('app');

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // Older entries were stored as "6年生"; show them the same as new "6年" entries.
  function displayGrade(g){
    return String(g).replace(/生$/, '');
  }

  // "2026/9/12 2:01" — the moment the record was registered (entry.ts).
  function formatWhen(ts){
    if (!ts) return '';
    var d = new Date(ts);
    if (isNaN(d.getTime())) return '';
    var mm = d.getMinutes();
    return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+(mm < 10 ? '0'+mm : mm);
  }

  function renderTableRows(list){
    if (!list.length){
      return '<tr><td colspan="7" class="empty">まだ登録がありません。黒帯の昇段試験を受けて、さいしょのランカーになろう。</td></tr>';
    }
    return list.map(function(e,i){
      return '<tr><td class="rank">'+(i+1)+'位</td><td>'+escapeHtml(displayGrade(e.grade))+' '+escapeHtml(e.cls)+'</td><td class="name">'+escapeHtml(e.name)+'</td>'+
        '<td class="pts">'+e.points+'</td><td>'+e.speed+'文字/分</td><td>'+e.accuracy+'%</td>'+
        '<td class="when">'+escapeHtml(formatWhen(e.ts))+'</td></tr>';
    }).join('');
  }

  function renderBodyHtml(loading){
    var rowsHtml = loading ? '<tr><td colspan="7" class="empty">読みこみちゅう…</td></tr>' : renderTableRows([]);

    var gradeOptions = ['1年','2年','3年','4年','5年','6年'].map(function(g){
      return '<option value="'+g+'">'+g+'</option>';
    }).join('');
    var clsOptions = ['1組','2組','3組','4組','ほしの子学級'].map(function(c){
      return '<option value="'+c+'">'+c+'</option>';
    }).join('');
    var formHtml =
      '<div class="register-card">'+
        '<span class="mono">黒帯の昇段試験の結果画面に出た「とうろくコード」を入力しよう</span>'+
        '<form id="registerForm">'+
          '<label>学年<select name="grade" required><option value="">えらぶ</option>'+gradeOptions+'</select></label>'+
          '<label>組・学級<select name="cls" required><option value="">えらぶ</option>'+clsOptions+'</select></label>'+
          '<label>ニックネーム＋名前<input name="name" maxlength="20" required></label>'+
          '<p class="name-note">直接本名を書き込むことのないようにしてくださいね。ふざけすぎたものや見た人を不快にさせるものはランキングにはのせません。</p>'+
          '<label>とうろくコード<input name="code" maxlength="20" placeholder="れい：3K2P1-9F" required style="font-family:Consolas,\'SF Mono\',Menlo,monospace;"></label>'+
          '<button type="submit" class="btn">ランキングボードに登録する</button>'+
          '<div class="form-note" id="formNote">&nbsp;</div>'+
        '</form>'+
        '<p class="lead" style="margin:12px 0 0; font-size:0.82rem;">コードがない人は<a class="back-link" href="'+EXAM_URL+'">黒帯の昇段試験を受けてね →</a></p>'+
      '</div>';

    var adminHtml =
      '<details class="admin-block" id="adminBlock">'+
        '<summary>管理者</summary>'+
        '<div class="admin-login" id="adminLogin">'+
          '<input type="password" id="adminPasswordInput" placeholder="管理者パスワード">'+
          '<button type="button" class="btn btn-quiet" id="adminLoginBtn">表示する</button>'+
        '</div>'+
        '<div class="admin-note" id="adminNote">&nbsp;</div>'+
        '<div id="adminListWrap"></div>'+
      '</details>';

    return ''+
      '<span class="eyebrow">ランキングボード</span>'+
      '<h1>チャレンジポイント ランキング</h1>'+
      '<p class="lead">黒帯の昇段試験の結果を登録して、道場のみんなと競おう。</p>'+
      formHtml+
      '<div class="table-wrap"><table class="rank-table"><thead><tr><th>順位</th><th>学年・組</th><th>なまえ</th><th>ポイント</th><th>速さ</th><th>正確率</th><th>とうろく日時</th></tr></thead><tbody id="rankBody">'+rowsHtml+'</tbody></table></div>'+
      adminHtml;
  }

  function updateRows(list){
    var body = document.getElementById('rankBody');
    if (body) body.innerHTML = renderTableRows(list);
  }

  var ERROR_MESSAGES = {
    invalid_grade: '学年・組・なまえをすべて入力してね。',
    invalid_cls: '学年・組・なまえをすべて入力してね。',
    invalid_name: '学年・組・なまえをすべて入力してね。',
    invalid_code: 'コードが正しくありません。結果画面のコードをよく見て、もう一度入力してね。'
  };

  function wireForm(){
    var form = document.getElementById('registerForm');
    if (!form) return;
    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      var fd = new FormData(form);
      var grade = (fd.get('grade')||'').toString().trim();
      var cls = (fd.get('cls')||'').toString().trim();
      var name = (fd.get('name')||'').toString().trim();
      var code = (fd.get('code')||'').toString().trim();
      var note = document.getElementById('formNote');
      if (!grade || !cls || !name || !code){
        note.textContent = '学年・組・なまえ・とうろくコードをすべて入力してね。';
        return;
      }
      var submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      note.textContent = 'とうろくちゅう…';
      register({grade:grade, cls:cls, name:name, code:code}, form);
    });
  }

  function register(payload, form){
    var note = document.getElementById('formNote');
    function reenable(){
      var btn = form.querySelector('button[type="submit"]');
      if (btn) btn.disabled = false;
    }
    fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    }).then(function(res){
      if (!res.ok){
        return res.json().catch(function(){ return {}; }).then(function(data){
          note.textContent = ERROR_MESSAGES[data.error] || 'とうろくに失敗しました。もう一度ためしてね。';
          reenable();
        });
      }
      return res.json().then(function(list){
        note.textContent = 'とうろくできました！';
        updateRows(list);
        form.reset();
        reenable();
      });
    }).catch(function(){
      note.textContent = 'とうろくに失敗しました。通信を確認してもう一度ためしてね。';
      reenable();
    });
  }

  var adminPassword = null;

  var GRADE_LIST = ['1年','2年','3年','4年','5年','6年'];
  var CLASS_LIST = ['1組','2組','3組','4組','ほしの子学級'];
  var RANK_LIST = [1,2,3,4,5];

  function optionsHtml(values, selected, labelFn){
    return values.map(function(v){
      return '<option value="'+escapeHtml(v)+'"'+(String(v) === String(selected) ? ' selected' : '')+'>'+escapeHtml(labelFn ? labelFn(v) : v)+'</option>';
    }).join('');
  }

  function renderAdminRows(list){
    if (!list.length){
      return '<tr><td colspan="10" class="empty">とうろくはまだありません。</td></tr>';
    }
    return list.map(function(e){
      var when = formatWhen(e.ts);
      var current = e.boardRank ? (e.boardRank+'位') : '圏外';
      var pinned = e.rankOverride ? String(e.rankOverride) : '';
      return '<tr data-ts="'+escapeHtml(e.ts||'')+'">'+
        '<td class="cur-rank">'+current+'</td>'+
        '<td><select class="f-rank" aria-label="順位を指定"><option value=""'+(pinned === '' ? ' selected' : '')+'>自動</option>'+
          optionsHtml(RANK_LIST, pinned, function(r){ return r+'位に固定'; })+'</select></td>'+
        '<td><select class="f-grade" aria-label="学年">'+optionsHtml(GRADE_LIST, displayGrade(e.grade))+'</select></td>'+
        '<td><select class="f-cls" aria-label="組・学級">'+optionsHtml(CLASS_LIST, e.cls)+'</select></td>'+
        '<td><input type="text" class="f-name" maxlength="20" value="'+escapeHtml(e.name)+'" aria-label="なまえ"></td>'+
        '<td><input type="number" class="f-num f-points" min="0" max="99999" step="1" value="'+escapeHtml(e.points)+'" aria-label="ポイント"></td>'+
        '<td><input type="number" class="f-num f-speed" min="0" max="9999" step="1" value="'+escapeHtml(e.speed)+'" aria-label="速さ（文字/分）"></td>'+
        '<td><input type="number" class="f-num f-acc" min="0" max="100" step="1" value="'+escapeHtml(e.accuracy)+'" aria-label="正確率（%）"></td>'+
        '<td class="when">'+escapeHtml(when)+'</td>'+
        '<td class="actions"><button type="button" class="admin-save-btn" data-ts="'+escapeHtml(e.ts||'')+'">保存</button>'+
          '<button type="button" class="admin-del-btn" data-ts="'+escapeHtml(e.ts||'')+'">削除</button></td>'+
      '</tr>';
    }).join('');
  }

  function renderAdminPanel(list){
    var wrap = document.getElementById('adminListWrap');
    if (!wrap) return;
    wrap.innerHTML =
      '<p class="admin-help">値を書きかえて「保存」を押すと反映されます。「順位を指定」で順位を選ぶと、その順位に固定されます（「自動」に戻すとポイント順）。同じ人（学年・組・なまえ）は、ふつう最高ポイントの1件だけがランキングにのります。</p>'+
      '<div class="table-wrap"><table class="admin-table"><thead><tr>'+
        '<th>いまの順位</th><th>順位を指定</th><th>学年</th><th>組・学級</th><th>なまえ</th><th>ポイント</th><th>速さ(文字/分)</th><th>正確率(%)</th><th>とうろく日時</th><th></th>'+
      '</tr></thead><tbody>'+renderAdminRows(list)+'</tbody></table></div>';

    wrap.querySelectorAll('tbody tr[data-ts]').forEach(function(row){
      row.querySelectorAll('input, select').forEach(function(el){
        el.addEventListener('input', function(){ row.classList.add('dirty'); });
        el.addEventListener('change', function(){ row.classList.add('dirty'); });
      });
      row.querySelectorAll('input').forEach(function(el){
        el.addEventListener('keydown', function(ev){
          if (ev.key === 'Enter'){ ev.preventDefault(); saveRow(row); }
        });
      });
    });
    wrap.querySelectorAll('.admin-save-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ saveRow(btn.closest('tr')); });
    });
    wrap.querySelectorAll('.admin-del-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var ts = btn.getAttribute('data-ts');
        var row = btn.closest('tr');
        var name = row ? row.querySelector('.f-name').value : '';
        if (!window.confirm('「'+name+'」のとうろくを削除します。よろしいですか？')) return;
        btn.disabled = true;
        deleteEntry(ts);
      });
    });
  }

  function refreshPublicRows(){
    fetch(API_URL).then(function(r){ return r.json(); }).then(updateRows).catch(function(){});
  }

  var SAVE_ERRORS = {
    invalid_grade: '学年・組・なまえを正しく入力してね。',
    invalid_cls: '学年・組・なまえを正しく入力してね。',
    invalid_name: 'なまえを入力してね。',
    invalid_number: 'ポイントは0〜99999、速さは0〜9999、正確率は0〜100の整数で入力してね。',
    invalid_rank: '順位は1〜5位から選んでね。',
    not_found: 'この記録は見つかりませんでした（すでに削除された可能性があります）。'
  };

  function saveRow(row){
    if (!row) return;
    var note = document.getElementById('adminNote');
    var saveBtn = row.querySelector('.admin-save-btn');
    var name = row.querySelector('.f-name').value.trim();
    if (!name){ note.textContent = 'なまえを入力してね。'; return; }
    var rankValue = row.querySelector('.f-rank').value;
    var payload = {
      ts: Number(row.getAttribute('data-ts')),
      grade: row.querySelector('.f-grade').value,
      cls: row.querySelector('.f-cls').value,
      name: name,
      points: row.querySelector('.f-points').value,
      speed: row.querySelector('.f-speed').value,
      accuracy: row.querySelector('.f-acc').value,
      rank: rankValue === '' ? null : Number(rankValue)
    };
    saveBtn.disabled = true;
    note.textContent = '保存ちゅう…';
    fetch(API_URL, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json', 'X-Admin-Password': adminPassword},
      body: JSON.stringify(payload)
    }).then(function(res){
      if (!res.ok){
        return res.json().catch(function(){ return {}; }).then(function(data){
          note.textContent = SAVE_ERRORS[data.error] || '保存に失敗しました。もう一度ためしてね。';
          saveBtn.disabled = false;
        });
      }
      return res.json().then(function(data){
        note.textContent = '保存しました。';
        renderAdminPanel(data.list || []);
        refreshPublicRows();
      });
    }).catch(function(){
      note.textContent = '保存に失敗しました。通信を確認してもう一度ためしてね。';
      saveBtn.disabled = false;
    });
  }

  function deleteEntry(ts){
    var note = document.getElementById('adminNote');
    fetch(API_URL, {
      method: 'DELETE',
      headers: {'Content-Type': 'application/json', 'X-Admin-Password': adminPassword},
      body: JSON.stringify({ts: Number(ts)})
    }).then(function(res){
      if (!res.ok){
        note.textContent = '削除に失敗しました。もう一度ためしてね。';
        return;
      }
      return res.json().then(function(data){
        note.textContent = '削除しました。';
        renderAdminPanel(data.list || []);
        refreshPublicRows();
      });
    }).catch(function(){
      note.textContent = '削除に失敗しました。通信を確認してもう一度ためしてね。';
    });
  }

  function wireAdmin(){
    var block = document.getElementById('adminBlock');
    if (!block) return;
    var loginBtn = document.getElementById('adminLoginBtn');
    var passwordInput = document.getElementById('adminPasswordInput');
    var note = document.getElementById('adminNote');
    loginBtn.addEventListener('click', function(){
      var pw = passwordInput.value;
      if (!pw){ note.textContent = 'パスワードを入力してね。'; return; }
      loginBtn.disabled = true;
      note.textContent = 'かくにんちゅう…';
      fetch(API_URL, { headers: {'X-Admin-Password': pw} }).then(function(res){
        if (!res.ok){
          note.textContent = 'パスワードが正しくありません。';
          loginBtn.disabled = false;
          return;
        }
        return res.json().then(function(data){
          adminPassword = pw;
          note.innerHTML = '&nbsp;';
          document.getElementById('adminLogin').style.display = 'none';
          renderAdminPanel(data.list || []);
        });
      }).catch(function(){
        note.textContent = '通信に失敗しました。もう一度ためしてね。';
        loginBtn.disabled = false;
      });
    });
    passwordInput.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter'){ ev.preventDefault(); loginBtn.click(); }
    });
  }

  function load(){
    app.innerHTML = renderBodyHtml(true);
    wireForm();
    wireAdmin();
    fetch(API_URL).then(function(res){
      if (!res.ok) throw new Error('bad status');
      return res.json();
    }).then(function(list){
      updateRows(list);
    }).catch(function(){
      var body = document.getElementById('rankBody');
      if (body) body.innerHTML = '<tr><td colspan="7" class="empty">ランキングを読みこめませんでした。時間をおいてためしてね。</td></tr>';
    });
  }

  load();
}
</script>
<script id="rb-boot">
(function(){
  RB_INIT();
})();
</script>
</body>
</html>
